<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vintage MTG Collection</title>
<meta name="description" content="Personal vintage Magic: The Gathering collection for sale — Revised, Legends, The Dark, Antiquities. Raw, ungraded, owned since 1994.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="wrap head">
  <h1>Vintage MTG Collection</h1>
  <p class="sets">1994 Revised · Legends · The Dark · Antiquities</p>
  <p class="intro">A personal collection, owned since 1994. All cards are raw (ungraded). Prices are market estimates per card.</p>
  <div class="controls">
    <input id="q" type="search" placeholder="Search cards or notes" aria-label="Search">
    <select id="setFilter" aria-label="Jump to group"><option value="">All groups</option></select>
  </div>
  <p id="count" class="count"></p>
</header>

<main class="wrap">
  <div class="table-wrap">
    <table id="list">
      <thead><tr>
        <th>Card</th><th class="c-set">Set</th><th class="c-r">Rarity</th>
        <th class="n">Qty</th><th class="n">Price</th><th class="c-notes">Notes</th>
      </tr></thead>
    </table>
  </div>
</main>

<footer class="wrap fine">Not affiliated with Wizards of the Coast.</footer>

<script src="data/bundle.js"></script>
<script src="app.js"></script>
</body>
</html>
